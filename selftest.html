<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V35 Self-test</title><link rel="stylesheet" href="./assets/style.css"></head><body><main><header><div class="eyebrow">V35 STATIC SELF-TEST</div><h1>Catalog Engine self-test</h1><p>Usa exatamente o mesmo catalog-index.json e resolver.js do Finder.</p></header><section id="out" class="result"></section></main><script type="module">import{resolve}from'./assets/resolver.js';const idx=await fetch('./assets/catalog-index.json').then(r=>r.json());const tests=[['BGP702 LED90/730 DX10P LGR 7035 SRG10 42','BGP702I'],['BVP656 LED400-4S/730 PSU II A35-MB GR','BVP656I'],['BDS670 LED50/730 MDA BK SRT SRG10 60P','BDS650I'],['BDS670 LED40/730 MDM BK SRT SRG10 60P','BDS650I'],['DN500B 20S/840 PSU-E WR WH PCO','DN500BI'],['DN610B 40S/930UE PSD-E C WH PGO','DN610BI'],['SM350C 50S/840 PSD PCS L1500 WH','SM350CI'],['WT490C 62S/840 PSU NE WB PI5 L1800','WT490CI']];let pass=0;let rows=tests.map(([q,e])=>{let r=resolve(q,idx),a=r.configurator||'';let ok=a===e;pass+=ok;return `<tr><td>${q}</td><td>${e}</td><td>${a||r.status}</td><td><b>${ok?'PASS':'FAIL'}</b></td></tr>`}).join('');document.querySelector('#out').innerHTML=`<div class="badge ${pass===tests.length?'CONFIRMED_PRODUCT':'NO_VERIFIED_ALTERNATIVE'}">${pass}/${tests.length} PASS</div><p>Relações indexadas: ${idx.relationships.length} · SKUs/EOCs: ${idx.skus.length}</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Teste</th><th>Esperado</th><th>Obtido</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div><style>td,th{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}</style>`;</script></body></html>
